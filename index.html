<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff • Discord Server</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: #fff;
    }

    /* FUNDO */
    body {
     background-image: url("nome-da-imagem.jpg");
      background-size: cover;
      background-position: center;
      animation: bgMove 40s ease-in-out infinite alternate;
    }

    @keyframes bgMove {
      from { background-position: center top; }
      to { background-position: center bottom; }
    }

    /* OVERLAY ESCURO */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    /* CANVAS */
    canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
    }

    /* CONTEÚDO */
    .content {
      position: relative;
      z-index: 3;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      backdrop-filter: blur(2px);
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(0, 200, 255, 0.8);
    }

    p {
      max-width: 600px;
      margin-top: 15px;
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .badge {
      margin-top: 25px;
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.6);
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <canvas id="stars"></canvas>

  <div class="content">
    <h1>STAFF DO SERVIDOR</h1>
    <p>
      Bem-vindo à equipe oficial do servidor.
      Aqui mantemos a ordem, a diversão e a comunidade sempre ativa 🌙✨
    </p>
    <div class="badge">Discord Staff</div>
  </div>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    resize();

    const stars = Array.from({ length: 120 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.3,
      o: Math.random(),
      s: Math.random() * 0.3 + 0.1
    }));

    const meteors = [];

    function spawnMeteor() {
      meteors.push({
        x: Math.random() * canvas.width,
        y: -50,
        vx: Math.random() * 6 + 6,
        vy: Math.random() * 6 + 6,
        life: 0
      });
    }

    setInterval(spawnMeteor, 3500);

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // estrelas
      stars.forEach(s => {
        s.o += (Math.random() - 0.5) * 0.02;
        s.o = Math.max(0.2, Math.min(1, s.o));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,220,255,${s.o})`;
        ctx.fill();
      });

      // estrelas cadentes
      meteors.forEach((m, i) => {
        m.x += m.vx;
        m.y += m.vy;
        m.life++;

        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.vx * 4, m.y - m.vy * 4);
        ctx.strokeStyle = 'rgba(200,230,255,0.8)';
        ctx.lineWidth = 2;
        ctx.stroke();

        if (m.x > canvas.width || m.y > canvas.height || m.life > 60) {
          meteors.splice(i, 1);
        }
      });

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
